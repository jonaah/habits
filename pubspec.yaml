name: habits
description: "A new Flutter project to track habits."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.1           # For state management
  hive: ^2.2.3               # For local data storage
  hive_flutter: ^1.1.0       # Flutter integration for Hive
  uuid: ^4.1.0               # For generating unique IDs
  intl: ^0.19.0              # For date formatting
  flutter_iconpicker: ^4.0.1 # For picking icons
  table_calendar: ^3.0.9     # For calendar view
  path_provider: ^2.1.2      # For accessing device file paths
  flutter_svg: ^2.0.9        # For SVG support

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1     # For Hive code generation
  build_runner: ^2.4.6       # For running code generators

flutter:
  uses-material-design: true
  
  # assets:
  #   - assets/images/

# Flutter Launcher Icons Konfiguration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF" # Hintergrundfarbe für adaptive Icons
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21 # Mindest-SDK-Version für Android
  remove_alpha_ios: true # Entfernt Transparenz für iOS (empfohlen für App Store)
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
